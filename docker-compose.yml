services:
  db:
    image: postgres:17-alpine
    container_name: badminton-score-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: badminton
      POSTGRES_PASSWORD: badminton
      POSTGRES_DB: badminton_score
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U badminton -d badminton_score"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db_data:
